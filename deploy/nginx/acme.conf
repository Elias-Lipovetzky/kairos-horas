include /etc/nginx/kairos/cloudflare-realip.conf;

server {
    listen 80;
    server_name kairoshoras.com;
    client_max_body_size 1m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/kairos/forward.conf;
    }
}
