include /etc/nginx/kairos/cloudflare-realip.conf;

server {
    listen 80;
    server_name kairoshoras.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://kairoshoras.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name kairoshoras.com;
    client_max_body_size 1m;

    ssl_certificate /etc/letsencrypt/live/kairoshoras.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kairoshoras.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KairosTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Also serve challenges here if Cloudflare redirects validation traffic to HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/kairos/forward.conf;
    }
}
