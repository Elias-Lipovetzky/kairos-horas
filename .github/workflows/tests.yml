name: Contrato y pruebas
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kairos_test
          POSTGRES_USER: kairos_test
          POSTGRES_PASSWORD: local_ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kairos_test -d kairos_test" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://kairos_test:local_ci_test_only@localhost:5432/kairos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: |
          if [ -f package-lock.json ]; then npm ci --no-fund --no-audit; else npm install --no-fund --no-audit; fi
      - name: Comprobar sintaxis
        run: npm run check
      - name: Comprobar formato
        run: npm run format:check
      - name: Contrato, reglas de negocio e integración aislada
        run: npm test
  https:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar scripts y protección de secretos del despliegue HTTPS
        run: |
          bash -n scripts/enable-https.sh scripts/lib/tls-http.sh scripts/tls-renew-hook.sh scripts/rollback-https.sh
          python3 -B test/tls-state.test.py
      - name: Probar Nginx, TLS, ACME, redirección y recarga del certificado
        env:
          KAIROS_TLS_TEST: '1'
        run: node --test test/tls-config.test.js
